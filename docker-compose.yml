version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentic_erp_postgres
    environment:
      POSTGRES_DB: agentic_erp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agentic_erp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Application
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agentic_erp_api
    environment:
      DATABASE_URL: postgresql://admin:securepassword123@postgres:5432/agentic_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-here
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Worker Service
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: agentic_erp_worker
    environment:
      DATABASE_URL: postgresql://admin:securepassword123@postgres:5432/agentic_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-here
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
    command: celery -A apps.worker.app worker --loglevel=info --concurrency=4

  # Celery Beat Scheduler
  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: agentic_erp_beat
    environment:
      DATABASE_URL: postgresql://admin:securepassword123@postgres:5432/agentic_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-here
      ENVIRONMENT: production
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
    command: celery -A apps.worker.app beat --loglevel=info

  # Flower Monitoring
  flower:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: agentic_erp_flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
      POSTGRES_PASSWORD: agentic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_user -d agentic_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_network
    restart: unless-stopped

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: agentic_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_network
    restart: unless-stopped

  # PostgreSQL Adminer (for database management)
  adminer:
    image: adminer:latest
    container_name: agentic_platform_adminer
    ports:
      - "8080:8080"
    networks:
      - agentic_network
    depends_on:
      - postgres
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: agentic_platform_api
    environment:
      DATABASE_URL: postgresql://agentic_user:agentic_password@postgres:5432/agentic_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: agentic_platform_worker
    environment:
      DATABASE_URL: postgresql://agentic_user:agentic_password@postgres:5432/agentic_platform
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic_network
    restart: unless-stopped

  # Celery Beat (scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: agentic_platform_celery_beat
    environment:
      DATABASE_URL: postgresql://agentic_user:agentic_password@postgres:5432/agentic_platform
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic_network
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info

  # FastAPI Frontend (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
    container_name: agentic_platform_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    depends_on:
      - api
    networks:
      - agentic_network
    restart: unless-stopped
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agentic_platform_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - agentic_network
    restart: unless-stopped

  # Redis Commander (Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agentic_platform_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - agentic_network
    depends_on:
      - redis
    restart: unless-stopped

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: agentic_platform_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - agentic_network
    restart: unless-stopped

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: agentic_platform_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - agentic_network
    restart: unless-stopped

  # Sentry (error tracking)
  sentry:
    image: sentry:latest
    container_name: agentic_platform_sentry
    environment:
      SENTRY_ENVIRONMENT: development
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "9000:9000"
    volumes:
      - sentry_data:/sentry
    networks:
      - agentic_network
    restart: unless-stopped
    command: send ray server --help

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  sentry_data:
    driver: local

networks:
  agentic_network:
    driver: bridge
