version: '3.8'

services:
  # Next.js 16 Web UI Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agentic_erp_web
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: always

  # FastAPI Python Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agentic_erp_api
    environment:
      - DATABASE_URL=sqlite:///./agents.db
      - ENVIRONMENT=production
      - PYTHONPATH=.
    ports:
      - "8000:8000"
    command: python mock_api.py
    restart: always

volumes:
  postgres_data:
